<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interlocking Ring Generator</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom styled scrollbars for controls panel */
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.15);
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased">
    <!-- Header -->
    <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700/60 p-4 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-sky-600 flex items-center justify-center font-bold text-white shadow-lg shadow-sky-600/30">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <circle cx="9" cy="12" r="6" stroke-width="2" stroke-linecap="round" />
                        <circle cx="15" cy="12" r="6" stroke-width="2" stroke-linecap="round" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white">Interlocking Ring Pattern Generator</h1>
                    <p class="text-xs text-slate-400">Generate Borromean & cyclic interlocked vector rings</p>
                </div>
            </div>
            
            <button id="downloadBtn" class="bg-sky-600 hover:bg-sky-500 text-white font-medium px-5 py-2.5 rounded-xl shadow-lg shadow-sky-600/25 transition-all duration-200 flex items-center gap-2 active:scale-95">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                </svg>
                Export High-Res PNG
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        
        <!-- Controls Panel -->
        <aside class="lg:col-span-4 bg-slate-800/50 backdrop-blur border border-slate-700/50 rounded-2xl p-5 space-y-6 custom-scroll overflow-y-auto max-h-[calc(100vh-7rem)]">
            
            <div class="border-b border-slate-700/60 pb-3">
                <h2 class="text-lg font-semibold text-slate-200">Geometry Settings</h2>
                <p class="text-xs text-slate-400">Customize count, scale, and offset</p>
            </div>

            <!-- Number of Rings -->
            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <label for="ringCount" class="text-sm font-medium text-slate-300">Number of Rings</label>
                    <span id="ringCountVal" class="text-xs font-mono px-2 py-0.5 bg-sky-950 text-sky-400 border border-sky-800/50 rounded-md font-semibold">3</span>
                </div>
                <input type="range" id="ringCount" min="3" max="25" value="3" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-sky-500">
                <div class="flex justify-between text-[10px] text-slate-500 px-1">
                    <span>3</span>
                    <span>8</span>
                    <span>15</span>
                    <span>25</span>
                </div>
            </div>

            <!-- Ring Radius -->
            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <label for="ringRadius" class="text-sm font-medium text-slate-300">Ring Radius</label>
                    <span id="ringRadiusVal" class="text-xs font-mono px-2 py-0.5 bg-slate-700 text-slate-300 rounded-md">160px</span>
                </div>
                <input type="range" id="ringRadius" min="80" max="300" value="160" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-sky-500">
            </div>

            <!-- Ring Thickness -->
            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <label for="strokeWidth" class="text-sm font-medium text-slate-300">Ring Thickness</label>
                    <span id="strokeWidthVal" class="text-xs font-mono px-2 py-0.5 bg-slate-700 text-slate-300 rounded-md">28px</span>
                </div>
                <input type="range" id="strokeWidth" min="8" max="70" value="28" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-sky-500">
            </div>

            <!-- Center Distance (Offset) -->
            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <label for="centerOffset" class="text-sm font-medium text-slate-300">Distance from Center</label>
                    <span id="centerOffsetVal" class="text-xs font-mono px-2 py-0.5 bg-slate-700 text-slate-300 rounded-md">95px</span>
                </div>
                <input type="range" id="centerOffset" min="20" max="220" value="95" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-sky-500">
            </div>

            <div class="border-b border-slate-700/60 pb-3 pt-2">
                <h2 class="text-lg font-semibold text-slate-200">Style & Weave</h2>
                <p class="text-xs text-slate-400">Configure appearance & interlocking logic</p>
            </div>

            <!-- Color Picker -->
            <div class="space-y-2">
                <label for="ringColor" class="text-sm font-medium text-slate-300 block">Ring Color</label>
                <div class="flex items-center gap-3">
                    <input type="color" id="ringColor" value="#0284c7" class="w-10 h-10 rounded-lg bg-transparent border-0 cursor-pointer">
                    <input type="text" id="ringColorText" value="#0284c7" class="bg-slate-700 border border-slate-600 rounded-lg px-3 py-1.5 text-sm font-mono text-slate-200 w-32 focus:outline-none focus:border-sky-500">
                    <button id="resetColor" class="text-xs text-slate-400 hover:text-sky-400 underline">Reset Blue</button>
                </div>
            </div>

            <!-- Weaving Mode Toggle -->
            <div class="space-y-3 pt-1">
                <label class="text-sm font-medium text-slate-300 block">Render Mode</label>
                <div class="grid grid-cols-2 gap-2 bg-slate-900/60 p-1 rounded-xl border border-slate-700/50">
                    <button id="modeInterlocked" class="py-2 px-3 text-xs font-medium rounded-lg transition-all duration-150 bg-sky-600 text-white shadow">
                        Alternating Weave
                    </button>
                    <button id="modeOverlap" class="py-2 px-3 text-xs font-medium rounded-lg text-slate-400 hover:text-slate-200 transition-all duration-150">
                        Simple Overlap
                    </button>
                </div>
            </div>

            <!-- Background Toggle -->
            <div class="space-y-2 pt-2">
                <label class="flex items-center gap-3 cursor-pointer">
                    <input type="checkbox" id="transparentBg" class="w-4 h-4 text-sky-600 rounded border-slate-700 bg-slate-900 focus:ring-sky-500">
                    <span class="text-sm text-slate-300 font-medium">Transparent Background on Canvas</span>
                </label>
            </div>

        </aside>

        <!-- Preview Canvas -->
        <section class="lg:col-span-8 bg-slate-800/30 border border-slate-700/50 rounded-2xl p-4 flex flex-col items-center justify-center min-h-[500px] relative overflow-hidden">
            <!-- Background Grid Pattern -->
            <div class="absolute inset-0 opacity-15 pointer-events-none" style="background-image: radial-gradient(#94a3b8 1px, transparent 1px); background-size: 24px 24px;"></div>

            <!-- Responsive Wrapper -->
            <div class="w-full h-full flex items-center justify-center relative z-0 min-h-[480px]">
                <canvas id="ringCanvas" class="max-w-full max-h-[75vh] object-contain rounded-xl shadow-2xl transition-shadow duration-300"></canvas>
            </div>

            <!-- Info Bar Footer -->
            <div class="w-full flex justify-between items-center mt-3 px-2 text-xs text-slate-500">
                <span id="resolutionIndicator">Canvas Size: 1600 x 1600 px</span>
                <span>Vector-grade Crisp Canvas</span>
            </div>
        </section>

    </main>

    <script>
        // DOM Elements
        const canvas = document.getElementById('ringCanvas');
        const ctx = canvas.getContext('2d');
        
        const ringCountInput = document.getElementById('ringCount');
        const ringCountVal = document.getElementById('ringCountVal');
        
        const ringRadiusInput = document.getElementById('ringRadius');
        const ringRadiusVal = document.getElementById('ringRadiusVal');
        
        const strokeWidthInput = document.getElementById('strokeWidth');
        const strokeWidthVal = document.getElementById('strokeWidthVal');
        
        const centerOffsetInput = document.getElementById('centerOffset');
        const centerOffsetVal = document.getElementById('centerOffsetVal');
        
        const ringColorInput = document.getElementById('ringColor');
        const ringColorTextInput = document.getElementById('ringColorText');
        const resetColorBtn = document.getElementById('resetColor');
        
        const modeInterlockedBtn = document.getElementById('modeInterlocked');
        const modeOverlapBtn = document.getElementById('modeOverlap');
        const transparentBgInput = document.getElementById('transparentBg');
        const downloadBtn = document.getElementById('downloadBtn');

        // Render Parameters
        let numRings = parseInt(ringCountInput.value, 10);
        let radius = parseInt(ringRadiusInput.value, 10);
        let strokeWidth = parseInt(strokeWidthInput.value, 10);
        let offset = parseInt(centerOffsetInput.value, 10);
        let strokeColor = ringColorInput.value;
        let isInterlocked = true;
        let isTransparent = false;

        // Base resolution canvas size
        const CANVAS_SIZE = 1600;
        canvas.width = CANVAS_SIZE;
        canvas.height = CANVAS_SIZE;

        // Sync inputs & labels
        function updateValuesFromUI() {
            numRings = parseInt(ringCountInput.value, 10);
            radius = parseInt(ringRadiusInput.value, 10);
            strokeWidth = parseInt(strokeWidthInput.value, 10);
            offset = parseInt(centerOffsetInput.value, 10);
            strokeColor = ringColorInput.value;

            ringCountVal.textContent = numRings;
            ringRadiusVal.textContent = `${radius}px`;
            strokeWidthVal.textContent = `${strokeWidth}px`;
            centerOffsetVal.textContent = `${offset}px`;
            ringColorTextInput.value = strokeColor;
        }

        /**
         * Calculates centers of all rings in canvas coordinates
         */
        function getRingCenters() {
            const centers = [];
            const centerX = CANVAS_SIZE / 2;
            const centerY = CANVAS_SIZE / 2;
            // Start top center angle (-90 deg)
            const angleStep = (2 * Math.PI) / numRings;
            const startAngle = -Math.PI / 2;

            for (let i = 0; i < numRings; i++) {
                const angle = startAngle + i * angleStep;
                const x = centerX + offset * Math.cos(angle);
                const y = centerY + offset * Math.sin(angle);
                centers.push({ x, y, angle });
            }
            return centers;
        }

        /**
         * Main Render Function
         */
        function drawRings() {
            ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            // Draw Background if not transparent
            if (!isTransparent) {
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
            }

            const centers = getRingCenters();

            if (!isInterlocked) {
                // Simple sequential overlap mode
                for (let i = 0; i < numRings; i++) {
                    drawFullRing(centers[i].x, centers[i].y, radius, strokeWidth, strokeColor);
                }
                return;
            }

            // TRUE INTERLOCKING WEAVE LOGIC
            // Strategy:
            // 1. First draw all complete ring bodies (without borders, or solid stroke with inner gap)
            // 2. We use a 3-pass layer method:
            //    Pass A: Draw all base full rings.
            //    Pass B: Overlap arc segments at intersection points where Ring(i) goes OVER Ring(i-1) or adjacent rings.
            //    Pass C: Draw clean borders/outlines using precise compositing.

            // 1. Draw base solid rings (with outline gaps)
            for (let i = 0; i < numRings; i++) {
                drawRingWithOutline(centers[i].x, centers[i].y, radius, strokeWidth, strokeColor);
            }

            // 2. Draw alternating over-segments at intersections
            // To achieve cyclic weave (Ring 0 over 1, 1 over 2, ... N-1 over 0),
            // we re-render short arc segments of each ring over its neighbor at key angles.
            for (let i = 0; i < numRings; i++) {
                const nextIdx = (i + 1) % numRings;
                
                // Find overlap angle between Ring i and Ring nextIdx
                const r1 = centers[i];
                const r2 = centers[nextIdx];
                
                // Vector from r1 to r2
                const dx = r2.x - r1.x;
                const dy = r2.y - r1.y;
                const angleToNext = Math.atan2(dy, dx);
                
                // Segment of Ring i that overlaps Ring nextIdx is around angleToNext
                // We draw an arc segment of Ring i over Ring nextIdx
                const arcSpan = Math.PI / 2.2; // Angle span for overlap patch
                
                // Draw mask outline segment first for clear separation
                drawArcSegmentWithOutline(
                    r1.x, r1.y, radius, strokeWidth, strokeColor, 
                    angleToNext - arcSpan / 2, angleToNext + arcSpan / 2
                );
            }
        }

        /**
         * Draws a single ring with dark inner/outer borders for crisp separation (like the reference icon)
         */
        function drawRingWithOutline(x, y, r, width, color) {
            // White/Transparent gap margin around rings
            const gap = Math.max(3, width * 0.12);

            // 1. Draw Gap Outer Cutout (Background color eraser)
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.lineWidth = width + gap * 2;
            ctx.strokeStyle = isTransparent ? 'rgba(255,255,255,1)' : '#ffffff';
            ctx.stroke();

            // 2. Draw Main Color Ring
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.lineWidth = width;
            ctx.strokeStyle = color;
            ctx.stroke();
        }

        /**
         * Draws an arc segment of a ring with border gap clearing for over-under weaving
         */
        function drawArcSegmentWithOutline(x, y, r, width, color, startAngle, endAngle) {
            const gap = Math.max(3, width * 0.12);

            // 1. Clear gap under the top arc
            ctx.beginPath();
            ctx.arc(x, y, r, startAngle, endAngle);
            ctx.lineWidth = width + gap * 2;
            ctx.strokeStyle = isTransparent ? 'rgba(255,255,255,1)' : '#ffffff';
            ctx.stroke();

            // 2. Draw top arc color
            ctx.beginPath();
            ctx.arc(x, y, r, startAngle, endAngle);
            ctx.lineWidth = width;
            ctx.strokeStyle = color;
            ctx.stroke();
        }

        /**
         * Simple ring drawing without interlock gaps
         */
        function drawFullRing(x, y, r, width, color) {
            const gap = Math.max(3, width * 0.12);
            
            // Outer Gap border
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.lineWidth = width + gap * 2;
            ctx.strokeStyle = isTransparent ? 'rgba(255,255,255,1)' : '#ffffff';
            ctx.stroke();

            // Main Stroke
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.lineWidth = width;
            ctx.strokeStyle = color;
            ctx.stroke();
        }

        // Event Listeners for UI Controls
        function setupEventListeners() {
            const inputs = [ringCountInput, ringRadiusInput, strokeWidthInput, centerOffsetInput];
            inputs.forEach(input => {
                input.addEventListener('input', () => {
                    updateValuesFromUI();
                    drawRings();
                });
            });

            ringColorInput.addEventListener('input', (e) => {
                ringColorTextInput.value = e.target.value;
                updateValuesFromUI();
                drawRings();
            });

            ringColorTextInput.addEventListener('change', (e) => {
                if (/^#[0-9A-F]{6}$/i.test(e.target.value)) {
                    ringColorInput.value = e.target.value;
                    updateValuesFromUI();
                    drawRings();
                }
            });

            resetColorBtn.addEventListener('click', () => {
                ringColorInput.value = '#0284c7';
                updateValuesFromUI();
                drawRings();
            });

            modeInterlockedBtn.addEventListener('click', () => {
                isInterlocked = true;
                modeInterlockedBtn.className = "py-2 px-3 text-xs font-medium rounded-lg transition-all duration-150 bg-sky-600 text-white shadow";
                modeOverlapBtn.className = "py-2 px-3 text-xs font-medium rounded-lg text-slate-400 hover:text-slate-200 transition-all duration-150";
                drawRings();
            });

            modeOverlapBtn.addEventListener('click', () => {
                isInterlocked = false;
                modeOverlapBtn.className = "py-2 px-3 text-xs font-medium rounded-lg transition-all duration-150 bg-sky-600 text-white shadow";
                modeInterlockedBtn.className = "py-2 px-3 text-xs font-medium rounded-lg text-slate-400 hover:text-slate-200 transition-all duration-150";
                drawRings();
            });

            transparentBgInput.addEventListener('change', (e) => {
                isTransparent = e.target.checked;
                drawRings();
            });

            downloadBtn.addEventListener('click', exportPNG);
        }

        /**
         * Export Canvas as PNG Image
         */
        function exportPNG() {
            // Create a temporary link
            const link = document.createElement('a');
            const fileColor = strokeColor.replace('#', '');
            link.download = `interlocking-rings-${numRings}rings-${fileColor}.png`;
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
        }

        // Initialize on Load
        window.addEventListener('load', () => {
            updateValuesFromUI();
            setupEventListeners();
            drawRings();
        });
    </script>
</body>
</html>
